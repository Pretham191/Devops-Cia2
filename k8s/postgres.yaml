# PostgreSQL for BeforeYouGo: one instance on an Azure managed disk.
# Reachable only inside the cluster (ClusterIP) — never exposed to the internet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: beforeyougo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: beforeyougo
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # a disk can attach to only one pod at a time
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: beforeyougo
            - name: POSTGRES_USER
              value: beforeyougo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beforeyougo-secrets
                  key: db-password
            - name: PGDATA      # subfolder: the disk root contains lost+found
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "beforeyougo", "-d", "beforeyougo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: beforeyougo
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
