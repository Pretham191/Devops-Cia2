---
# Deploys BeforeYouGo to AKS and verifies it. Called by the Jenkinsfile:
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
#     -e app_image=<acr>/beforeyougo:<tag> -e app_version=<tag>
# Secrets come from environment variables injected by Jenkins credentials:
#   DB_PASSWORD, ADMIN_USERNAME, ADMIN_PASSWORD
- name: Deploy BeforeYouGo to AKS
  hosts: jenkins_host
  gather_facts: false

  vars:
    app_namespace: beforeyougo
    manifests: "{{ playbook_dir }}/../k8s"
    target_replicas: 2
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    admin_username: "{{ lookup('env', 'ADMIN_USERNAME') }}"
    admin_password: "{{ lookup('env', 'ADMIN_PASSWORD') }}"

  tasks:
    - name: Check required inputs
      ansible.builtin.assert:
        that:
          - app_image is defined and app_image | length > 0
          - app_version is defined and app_version | length > 0
          - db_password | length > 0
          - admin_username | length > 0
          - admin_password | length > 0
        fail_msg: "Pass app_image/app_version with -e and set DB_PASSWORD, ADMIN_USERNAME, ADMIN_PASSWORD"
        quiet: true

    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests }}/namespace.yaml"

    - name: Create or update application secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: beforeyougo-secrets
            namespace: "{{ app_namespace }}"
          type: Opaque
          stringData:
            db-password: "{{ db_password }}"
            admin-username: "{{ admin_username }}"
            admin-password: "{{ admin_password }}"
      no_log: true

    - name: Deploy PostgreSQL (volume, deployment, internal service)
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests }}/postgres.yaml"
        wait: true
        wait_timeout: 300

    - name: Check whether the app has been deployed before
      kubernetes.core.k8s_info:
        kind: Deployment
        name: beforeyougo
        namespace: "{{ app_namespace }}"
      register: existing_app

    # On the very first deploy the database is empty and every pod would try to
    # seed it. Start one pod so seeding happens exactly once, then scale out.
    - name: Decide replica count for this rollout
      ansible.builtin.set_fact:
        first_deploy: "{{ existing_app.resources | length == 0 }}"

    - name: Roll out the new image and wait until all pods are ready
      kubernetes.core.k8s:
        state: present
        template: "{{ manifests }}/app-deployment.yaml"
        wait: true
        wait_timeout: 420
      vars:
        app_replicas: "{{ 1 if first_deploy else target_replicas }}"

    - name: Scale out after the first deploy has seeded the database
      kubernetes.core.k8s:
        state: present
        template: "{{ manifests }}/app-deployment.yaml"
        wait: true
        wait_timeout: 420
      vars:
        app_replicas: "{{ target_replicas }}"
      when: first_deploy

    - name: Expose the app through an Azure Load Balancer
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests }}/app-service.yaml"

    - name: Wait for the public IP
      kubernetes.core.k8s_info:
        kind: Service
        name: beforeyougo
        namespace: "{{ app_namespace }}"
      register: svc
      until: svc.resources[0].status.loadBalancer.ingress is defined
      retries: 30
      delay: 10

    - name: Remember the endpoint
      ansible.builtin.set_fact:
        app_url: "http://{{ svc.resources[0].status.loadBalancer.ingress[0].ip }}"

    - name: Verify the app reports ready through the load balancer
      ansible.builtin.uri:
        url: "{{ app_url }}/actuator/health/readiness"
        return_content: true
      register: health
      until: health.status == 200 and health.json.status == 'UP'
      retries: 30
      delay: 5

    - name: Verify the new build is the one being served
      ansible.builtin.uri:
        url: "{{ app_url }}/"
        return_content: true
      register: home
      until: home.status == 200 and app_version in home.content
      retries: 12
      delay: 5

    - name: Deployment summary
      ansible.builtin.debug:
        msg: "BeforeYouGo build {{ app_version }} is live at {{ app_url }}"
