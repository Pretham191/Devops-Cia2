# Activated with SPRING_PROFILES_ACTIVE=prod.
# No defaults on purpose: startup fails fast if any of these env vars is missing.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# Seed sample data only when the database is empty (checked in DataSeeder).
app.seed.enabled=true
