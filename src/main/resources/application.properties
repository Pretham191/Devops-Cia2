spring.application.name=beforeyougo
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- App ----
# APP_VERSION is injected by the pipeline (build tag); shown in every page footer.
app.version=${APP_VERSION:local-dev}
app.timezone=Asia/Kolkata
app.seed.enabled=true
# Local-only defaults. The prod profile overrides these from ADMIN_USERNAME / ADMIN_PASSWORD.
app.admin.username=admin
app.admin.password=admin123

# ---- Database (default: H2 in-memory) ----
spring.datasource.url=jdbc:h2:mem:beforeyougo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Actuator: only health + info, with Kubernetes probes ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=BeforeYouGo
info.app.version=${app.version}

spring.thymeleaf.cache=true
