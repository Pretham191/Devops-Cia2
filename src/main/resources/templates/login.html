<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap narrow">
    <h1>Admin sign in</h1>
    <p class="flash flash-error" role="alert" th:if="${param.error}">Wrong username or password.</p>
    <p class="flash flash-ok" role="status" th:if="${param.logout}">You have been signed out.</p>

    <form class="card form" th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
